<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tacoma Figure Skating Club | Contact Us</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <div id="logo"></div>
            <h1 class="visually-hidden">Tacoma Figure Skating Club</h1>
            <nav>
                <h2 class="visually-hidden">Main Navigation</h2>
                <input type="checkbox" id="menu-toggle">
                <label for="menu-toggle"><span></span></label>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="group-classes.html">Group Classes</a></li>
                    <li><a href="schedule.html">Schedule</a></li>
                    <li><a href="coaches.html">Coaches</a></li>
                    <li><a href="local-events.html">Local Events</a></li>
                    <li><a href="contact.html" class="current-page">Contact Us</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="hero bannerModification">
                <div class="hero-text text-center wrapper">
                    <h2>Contact Us!</h2>
                </div>
            </section>
            <section>
                <div class="wrapper">
                    <h2>Have a question? Fill out the form below!</h2>
                    <form action="" method="get" class="contact-form">
                        <p>
                            <label for="fullName">Full Name:</label>
                            <input type="text" pattern="[A-Za-z]+" name="fullName" id="fullName" required>
                        </p>
                        <p>
                            <label for="email">Email Address:</label>
                            <input type="email" name="email" id="email" required>
                        </p>
                        <p>
                            <label for="subject">Topic of Interest:</label>
                            <input type="text" name="subject" id="subject">
                        </p>
                        <p>
                            <label for="details">How can we help you?</label>
                            <textarea id="details" rows="4" name="details" required></textarea>
                        </p>
                        <p>
                            <input class="button" type="submit" value="Submit">
                        </p>
                    </form>
                </div>
            </section>
        </main>
        <footer class="text-center">
            <p>Tacoma Figure Skating Club &copy; 2026. All rights reserved.</p>
            <a class="current-page" href="contact.html">Contact Us</a>
        </footer>
    </body>
</html>
